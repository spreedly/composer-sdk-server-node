name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs all dependency code (install, build, tests) without id-token, so
  # nothing here can request the OIDC token npm accepts for publishing.
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.check.outputs.name }}
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the main ancestry check can see main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check tag, version and CHANGELOG.md
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if ! grep -qxF "export const VERSION = \"${VERSION}\";" src/version.ts; then
            echo "src/version.ts does not match package.json version ${VERSION}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
          HEADING="$(grep -m1 -E "^## ${VERSION//./\\.}( |$)" CHANGELOG.md || true)"
          if [[ -z "${HEADING}" || "${HEADING,,}" == *unreleased* ]]; then
            echo "CHANGELOG.md needs a released '## ${VERSION}' section"
            exit 1
          fi
          awk -v v="${VERSION}" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack
        id: pack
        run: |
          TARBALL="$(npm pack)"
          sha256sum "${TARBALL}" > SHA256SUMS
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > sbom.cdx.json
          # npm sbom names the root component after the checkout folder.
          node -e "const fs = require('fs'); const b = JSON.parse(fs.readFileSync('sbom.cdx.json')); b.metadata.component.name = require('./package.json').name; fs.writeFileSync('sbom.cdx.json', JSON.stringify(b, null, 2) + '\n')"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      # Scans the files customers receive, including built dist/. The hash pins
      # the download; --redact keeps a found secret's value out of the public
      # log while --verbose still shows where it is.
      - name: Scan tarball for secrets
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          mkdir "${RUNNER_TEMP}/package"
          tar -xzf "${TARBALL}" -C "${RUNNER_TEMP}/package"
          ./gitleaks dir "${RUNNER_TEMP}/package" --redact --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            *.tgz
            SHA256SUMS
            sbom.cdx.json
            release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers and the v* tag rule live on this environment, and the
    # npm trusted publisher is bound to it.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Verify tarball checksum
        run: sha256sum -c SHA256SUMS

      # No registry-url: it writes an auth token placeholder to .npmrc, which
      # turns a failed OIDC exchange into a misleading 404. check-latest keeps
      # an older cached Node from bringing an npm too old for trusted
      # publishing.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Check version is not already on npm
        run: |
          if EXISTING="$(npm view "${NAME}@${VERSION}" version 2> /dev/null)" && [[ -n "${EXISTING}" ]]; then
            echo "${NAME}@${VERSION} is already on npm"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish "./${TARBALL}" --provenance --access public

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md "./${TARBALL}" SHA256SUMS sbom.cdx.json
