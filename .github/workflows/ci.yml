name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirror the `engines.node` floor in package.json (>=22) and current.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` builds (cjs/esm/umd/types) and then runs the Vitest suite,
      # so this gates both the published artifacts and the tests.
      - name: Build and test
        run: npm test
